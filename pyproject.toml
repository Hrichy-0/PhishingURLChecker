[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ml"
version = "0.1.0"
description = "Learning-focused phishing URL classifier, API, and Chrome extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
  "tldextract>=5.3,<6",
]

[project.optional-dependencies]
data = ["kagglehub>=0.3,<1"]
dev = [
  "httpx>=0.27,<1",
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "pytest>=8,<9",
  "ruff>=0.7,<1",
  "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
